[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo_classifier"
version = "0.1.3"
description = "A library for classifying GitHub repositories"
readme = "README.md"
authors = [
    {name = "Sam Hsu", email = "yxu166@jhu.edu"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
]

[dependency-groups]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.10.0",
    "black>=24.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "pylint>=3.0.0",
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false 

[project.urls]
Homepage = "https://github.com/samhsu-dev/repo_classifier"
Documentation = "https://github.com/samhsu-dev/repo_classifier"
Source = "https://github.com/samhsu-dev/repo_classifier"

[tool.hatch.build.targets.wheel]
packages = ["src/classifier"]